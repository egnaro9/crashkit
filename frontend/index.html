<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Crash Test</title>
<style>
  :root { --bg:#0b0f14; --panel:#111823; --line:#1f2a37; --fg:#e6edf3; --muted:#8899a6;
          --pass:#3fb950; --fail:#f85149; --amber:#d29922; --accent:#58a6ff; --teal:#39c5cf;
          --crit:#f85149; --high:#f0883e; --med:#d29922; --low:#8899a6; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  .wrap { max-width:920px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:26px; margin:0 0 4px; letter-spacing:-.01em; }
  .sub { color:var(--muted); margin:0 0 24px; } .sub code { color:var(--accent); }
  .sub b { color:var(--fg); font-weight:600; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:20px; }
  label { color:var(--muted); font-size:13px; display:block; margin-bottom:6px; }
  select, button, input { font:inherit; border-radius:7px; border:1px solid var(--line); }
  select, input { background:#0d141d; color:var(--fg); padding:9px 12px; } input { width:100%; }
  button { background:var(--accent); color:#08111f; border:none; padding:10px 18px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; align-items:end; flex-wrap:wrap; gap:10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .byok { border:1px solid var(--teal); border-radius:8px; padding:14px; margin-top:12px; background:rgba(57,197,207,.05); }
  .byok .note { color:var(--teal); font-size:13px; margin:0 0 10px; } .byok .note b { color:var(--fg); }
  .cors { color:var(--muted); font-size:12px; margin:10px 0 0; } .cors code { color:var(--accent); }
  .cors b { color:var(--fg); }
  .verify { margin:2px 0 4px; font-size:13px; }
  .verify summary { cursor:pointer; color:var(--fg); font-weight:600; list-style:none;
    display:inline-block; padding:6px 13px; border:1px solid var(--teal); border-radius:20px;
    background:rgba(57,197,207,.10); }
  .verify summary:hover { background:rgba(57,197,207,.18); }
  .verify summary::-webkit-details-marker { display:none; }
  .verify[open] summary { margin-bottom:8px; }
  .verify p { color:var(--muted); margin:8px 0; } .verify a { color:var(--accent); }
  .verify p b { color:var(--fg); }
  .verify pre { background:#0d141d; border:1px solid var(--line); border-radius:6px; padding:10px; overflow:auto; font-size:12px; color:var(--fg); }
  .headline { display:flex; gap:28px; margin:16px 0 8px; }
  .metric b { font-size:26px; display:block; } .metric span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .vuln b { color:var(--fail); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:500; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .card { border:1px solid var(--line); border-left-width:3px; border-radius:8px; padding:12px 14px; margin:10px 0; }
  .card.critical { border-left-color:var(--crit); } .card.high { border-left-color:var(--high); }
  .card.med { border-left-color:var(--med); } .card.low { border-left-color:var(--low); }
  .card .kind { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .card .prompt { margin:4px 0 8px; } .card .detail { color:var(--muted); font-size:13px; } .card .detail b { color:var(--fg); }
  .sev { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .sev.critical { color:var(--crit); } .sev.high { color:var(--high); } .sev.med { color:var(--med); }
  .q { color:var(--muted); font-size:13px; } .err { color:var(--fail); font-size:13px; margin-top:8px; }
  .foot { color:var(--muted); font-size:12px; margin-top:26px; } .foot b { color:var(--fg); }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const pct = x => (x * 100).toFixed(0) + "%";
const GRADE_SRC = "https://github.com/egnaro9/crashkit/blob/main/crashkit/app.py";

// Providers. `shape` = the API format its adapter uses; the OpenAI-shaped ones
// (xAI, Groq, OpenAI, custom) all route through one adapter, just with different
// base URLs. Model lists are curated; a "custom…" option covers new/local models.
const PROVIDERS = {
  anthropic: { label: "Anthropic", shape: "anthropic", host: "api.anthropic.com",
               models: ["claude-haiku-4-5", "claude-sonnet-5", "claude-opus-4-8", "claude-fable-5"] },
  gemini:    { label: "Google Gemini", shape: "gemini", host: "generativelanguage.googleapis.com",
               models: ["gemini-3.6-flash", "gemini-3.5-flash-lite", "gemini-2.5-flash", "gemini-2.5-pro"] },
  xai:       { label: "xAI (Grok)", shape: "openai", base: "https://api.x.ai/v1", host: "api.x.ai",
               models: ["grok-4", "grok-4-fast", "grok-3", "grok-3-mini"] },
  groq:      { label: "Groq (Llama, gpt-oss…)", shape: "openai", base: "https://api.groq.com/openai/v1", host: "api.groq.com",
               models: ["llama-3.3-70b-versatile", "llama-3.1-8b-instant", "openai/gpt-oss-120b"] },
  openai:    { label: "OpenAI (often blocks in-browser)", shape: "openai", base: "https://api.openai.com/v1", host: "api.openai.com",
               models: ["gpt-4o-mini", "gpt-4o"] },
  custom:    { label: "OpenAI-compatible / local / custom", shape: "openai", base: "", host: "the endpoint you set",
               models: [], custom: true },
};

// --- client-side adapters: the browser calls the provider DIRECTLY. The key
// goes ONLY to the provider host, never to this server.
async function callProvider(cfg, prompt) {
  if (cfg.shape === "anthropic") {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": cfg.key,
                 "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: cfg.model, max_tokens: 256, messages: [{ role: "user", content: prompt }] }),
    });
    if (!r.ok) throw new Error("Anthropic " + r.status + " — " + (await r.text()).slice(0, 140));
    return ((await r.json()).content || []).map(b => b.text || "").join("");
  }
  if (cfg.shape === "gemini") {
    const r = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + cfg.model + ":generateContent", {
      method: "POST", headers: { "content-type": "application/json", "x-goog-api-key": cfg.key },
      body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
    });
    if (!r.ok) throw new Error("Gemini " + r.status + " — " + (await r.text()).slice(0, 140));
    return ((await r.json()).candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
  }
  const base = (cfg.base || "https://api.openai.com/v1").replace(/\/$/, "");
  const r = await fetch(base + "/chat/completions", {
    method: "POST", headers: { "content-type": "application/json", "authorization": "Bearer " + cfg.key },
    body: JSON.stringify({ model: cfg.model, max_tokens: 256, messages: [{ role: "user", content: prompt }] }),
  });
  if (!r.ok) throw new Error("Provider " + r.status + " — " + (await r.text()).slice(0, 140));
  return (await r.json()).choices[0].message.content;
}

function App() {
  const [batteries, setBatteries] = useState([]);
  const [battery, setBattery] = useState("adversarial");
  const [model, setModel] = useState("");
  const [byok, setByok] = useState({ provider: "anthropic", model: "claude-haiku-4-5", customModel: "", baseUrl: "", key: "" });
  const [run, setRun] = useState(null);
  const [board, setBoard] = useState([]);
  const [status, setStatus] = useState(""); const [err, setErr] = useState(""); const [busy, setBusy] = useState(false);
  const [lastPayload, setLastPayload] = useState(null);
  const [n, setN] = useState(1);
  const [variance, setVariance] = useState(null);

  const current = batteries.find(b => b.id === battery);
  const isByok = model === "__byok__";
  const prov = PROVIDERS[byok.provider];
  const effModel = (byok.model === "__custom__" ? byok.customModel : byok.model).trim();
  const effBase = prov.custom ? byok.baseUrl.trim() : (prov.base || "");
  const host = prov.custom ? (effBase ? new URL(effBase.startsWith("http") ? effBase : "https://" + effBase).host : "the endpoint you set") : prov.host;
  const loadBoard = () => fetch("/api/runs").then(r => r.json()).then(setBoard);

  useEffect(() => {
    fetch("/api/batteries").then(r => r.json()).then(bs => {
      setBatteries(bs); const b = bs.find(x => x.id === battery) || bs[0];
      if (b) { setBattery(b.id); setModel(b.models[0]?.id || ""); }
    });
    loadBoard();
  }, []);

  const onBattery = id => { setBattery(id); setRun(null); setErr("");
    const b = batteries.find(x => x.id === id); setModel(b?.models[0]?.id || ""); };
  const onProvider = p => setByok({ ...byok, provider: p, model: PROVIDERS[p].models[0] || "__custom__", customModel: "" });

  const runMock = async () => {
    const r = await fetch("/api/run", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ model, battery }) });
    setRun(await r.json());
  };

  const runByok = async () => {
    const bat = await fetch("/api/battery/" + battery).then(r => r.json());
    const cfg = { shape: prov.shape, base: effBase, model: effModel, key: byok.key.trim() };
    const answers = {};
    for (let i = 0; i < bat.tasks.length; i++) {
      setStatus(`Asking the model… ${i + 1}/${bat.tasks.length}`);
      answers[bat.tasks[i].id] = await callProvider(cfg, bat.tasks[i].prompt);
    }
    setStatus("Grading…");
    const payload = { battery, model: byok.provider + ":" + effModel, answers };  // <- no key here
    setLastPayload(payload);
    const r = await fetch("/api/grade", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(payload) });
    setRun(await r.json());
  };

  const runMockMulti = async () => {
    const r = await fetch("/api/run-multi", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ model, battery, n }) });
    setVariance(await r.json());
  };

  const runByokMulti = async () => {
    const bat = await fetch("/api/battery/" + battery).then(r => r.json());
    const cfg = { shape: prov.shape, base: effBase, model: effModel, key: byok.key.trim() };
    const sets = [];
    for (let run = 0; run < n; run++) {
      const answers = {};
      for (let i = 0; i < bat.tasks.length; i++) {
        setStatus(`Run ${run + 1}/${n} · asking… ${i + 1}/${bat.tasks.length}`);
        answers[bat.tasks[i].id] = await callProvider(cfg, bat.tasks[i].prompt);
      }
      sets.push(answers);
    }
    setStatus("Grading…");
    const payload = { battery, model: byok.provider + ":" + effModel, answer_sets: sets };  // <- no key
    setLastPayload({ ...payload, answer_sets: `[…${sets.length} runs…]` });
    const r = await fetch("/api/grade-multi", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify(payload) });
    setVariance(await r.json());
  };

  const doRun = async () => {
    setBusy(true); setErr(""); setRun(null); setVariance(null);
    try {
      if (n > 1) { isByok ? await runByokMulti() : await runMockMulti(); }
      else { isByok ? await runByok() : await runMock(); await loadBoard(); }
    }
    catch (e) { setErr(String(e.message || e)); } finally { setBusy(false); setStatus(""); }
  };

  const crashTest = battery !== "suite";
  const fails = run ? run.cases.filter(c => c.flagged) : [];

  return (
    <div className="wrap">
      <h1>AI Crash Test</h1>
      <p className="sub">Point it at a model, run a battery, read the <b>deterministic grades</b>.
        <b>No LLM judge</b> — every verdict is a <b>predicate you can rerun</b>.{" "}
        <code>no signup · your key stays in your browser</code></p>

      <div className="panel">
        <div className="row">
          <div><label>Battery</label>
            <select value={battery} onChange={e => onBattery(e.target.value)}>
              {batteries.map(b => <option key={b.id} value={b.id}>{b.label}</option>)}
            </select></div>
          <div><label>Crash-test dummy</label>
            <select value={model} onChange={e => { setModel(e.target.value); setErr(""); }}>
              {(current?.models || []).map(m => <option key={m.id} value={m.id}>{m.name}</option>)}
              {battery !== "agentic" && <option value="__byok__">Bring your own key (real model)…</option>}
            </select></div>
          <div style={{maxWidth:78}}><label title="Run the battery N times and report the variance">Runs</label>
            <input type="number" min="1" max="50" value={n}
              onChange={e => setN(Math.max(1, Math.min(50, parseInt(e.target.value) || 1)))} /></div>
          <button onClick={doRun} disabled={busy || (isByok && (!byok.key || !effModel))}>
            {busy ? (status || "Running…") : (n > 1 ? `Run ×${n}` : "Run the battery")}</button>
        </div>

        {battery === "agentic" && (
          <p className="note">🧭 The agentic battery scores an agent's <b>tool-call trajectory</b> against
            an expected plan (deterministic ordered-overlap, partial credit). It's <b>mock-only here</b> —
            grading a real model needs a tool-calling agent loop to record the trajectory, which this
            in-browser playground doesn't run.</p>
        )}

        {isByok && (
          <div className="byok">
            <p className="note">🔒 <b>Your key never leaves this browser.</b> It's sent only to the
              provider you pick — never to this server.</p>
            <details className="verify">
              <summary>Prove it — what does this server actually receive?</summary>
              <p>Your key is sent only to <b>{host}</b>. Below is the entire request our server receives —
                <b> there is no key field in it</b>. <b>Don't trust this panel</b>: open the{" "}
                <b>Network tab</b> (your browser's own record — <b>we can't fake it</b>), and read the{" "}
                <a href={GRADE_SRC} target="_blank" rel="noopener">open-source grade endpoint</a>, which
                has <b>no key parameter</b>.</p>
              <pre>{lastPayload
                ? "POST /api/grade\n" + JSON.stringify({ ...lastPayload, answers: "{…answers…}" }, null, 2)
                : "Run once — this shows the exact payload posted to our server (no key)."}</pre>
            </details>
            <div className="grid">
              <div><label>Provider</label>
                <select value={byok.provider} onChange={e => onProvider(e.target.value)}>
                  {Object.entries(PROVIDERS).map(([id, p]) => <option key={id} value={id}>{p.label}</option>)}
                </select></div>
              <div><label>Model</label>
                <select value={byok.model} onChange={e => setByok({ ...byok, model: e.target.value })}>
                  {prov.models.map(m => <option key={m} value={m}>{m}</option>)}
                  <option value="__custom__">custom…</option>
                </select></div>
              {byok.model === "__custom__" && <div style={{gridColumn:"1 / -1"}}>
                <label>Custom model id</label>
                <input value={byok.customModel} onChange={e => setByok({ ...byok, customModel: e.target.value })} placeholder="model id" /></div>}
              {prov.custom && <div style={{gridColumn:"1 / -1"}}>
                <label>Base URL (Groq, Together, OpenRouter, a local server…)</label>
                <input value={byok.baseUrl} onChange={e => setByok({ ...byok, baseUrl: e.target.value })} placeholder="https://api.openai.com/v1" /></div>}
              <div style={{gridColumn:"1 / -1"}}><label>API key (stays in this tab)</label>
                <input type="password" autoComplete="off" value={byok.key}
                  onChange={e => setByok({ ...byok, key: e.target.value })} placeholder="sk-…" /></div>
            </div>
            <p className="cors">The key goes only to <code>{host}</code>. Browser-callability depends on
              the provider: <b>Anthropic and Gemini work directly</b>; xAI/Groq/local usually do;
              <b> OpenAI's own API often blocks browser calls (CORS)</b>. If a call CORS-errors, that
              provider can't run never-touches from a browser — use a host that allows it (e.g. Groq) or a
              local server.</p>
          </div>
        )}

        {err && <div className="err">⚠ {err}</div>}

        {run && (
          <div>
            <div className="headline">
              {crashTest && <div className="metric vuln"><b>{pct(run.metrics.vulnerability_score || 0)}</b><span>vulnerability</span></div>}
              <div className="metric"><b>{pct(run.metrics.faithfulness)}</b><span>{crashTest ? "resisted" : "accuracy"}</span></div>
              <div className="metric"><b>{run.metrics.flagged_cases}</b><span>failures</span></div>
            </div>
            {run.per_kind && (
              <table><thead><tr><th>Attack kind</th><th>Resisted</th></tr></thead>
                <tbody>{Object.entries(run.per_kind).map(([k, v]) =>
                  <tr key={k}><td>{k}</td><td style={{color: v < 1 ? "var(--fail)" : "var(--pass)"}}>{pct(v)}</td></tr>)}
                </tbody></table>)}
            {fails.length > 0 && <div style={{marginTop:14}}>
              <label>Caught vulnerabilities</label>
              {fails.map((c, i) => { const sev = c.severity || "med"; return (
                <div className={"card " + sev} key={i}>
                  <div className="kind">{c.note.split(" · ")[0]} · <span className={"sev " + sev}>{sev}</span></div>
                  <div className="prompt">{c.q.replace(/^\[[^\]]+\]\s*/, "")}</div>
                  <div className="detail">{c.detail} · <b>{c.grader}</b></div>
                </div>); })}
            </div>}
          </div>
        )}

        {variance && (
          <div>
            <div className="headline">
              <div className="metric vuln"><b>{pct(variance.metrics.worst_case_vulnerability)}</b><span>worst-case</span></div>
              <div className="metric"><b>{pct(variance.metrics.mean_vulnerability)}</b><span>mean / run</span></div>
              <div className="metric"><b>{pct(variance.metrics.stability)}</b><span>stability</span></div>
              <div className="metric"><b>{variance.metrics.flaky_cases}</b><span>flaky</span></div>
            </div>
            <p className="q">Over <b>{variance.n}</b> runs. <b>Worst-case</b> counts a task as failed if it
              failed in <b>any</b> run — the posture an attacker actually faces; <b>mean</b> is what a
              single run expects. The gap is the intermittent risk a one-shot test misses.</p>
            <table><thead><tr><th>Task</th><th>Kind</th><th>Pass rate</th><th></th></tr></thead>
              <tbody>{variance.per_task.map(t => (
                <tr key={t.id}>
                  <td>{t.id}</td><td>{t.kind}</td>
                  <td style={{color: t.pass_rate < 1 ? "var(--fail)" : "var(--pass)"}}>
                    {pct(t.pass_rate)} <span className="q">({t.passes}/{t.runs})</span></td>
                  <td>{t.flaky ? <span className="sev high">flaky</span>
                    : t.ever_failed ? <span className="sev critical">always fails</span> : ""}</td>
                </tr>))}
              </tbody></table>
          </div>
        )}
      </div>

      <div className="panel">
        <label>Leaderboard — most vulnerable first</label>
        <table>
          <thead><tr><th>Model</th><th>Vulnerability</th><th>Accuracy</th><th>Source</th></tr></thead>
          <tbody>
            {board.length === 0 && <tr><td colSpan="4" className="q">No runs yet — run one above.</td></tr>}
            {board.map(r => (<tr key={r.id}>
              <td>{r.model}</td>
              <td style={{color: r.vulnerability > 0 ? "var(--fail)" : "var(--muted)"}}>{r.vulnerability == null ? "—" : pct(r.vulnerability)}</td>
              <td>{pct(r.accuracy)}</td><td className="q">{r.source}</td></tr>))}
          </tbody>
        </table>
      </div>

      <p className="foot"><b>One engine, four lenses</b> — every battery above is a grader from the
        same shared system, not a reimplementation: <b>correctness</b> is <b>model-drift's</b> own
        frozen suite (identical <code>suite_hash</code>), <b>adversarial</b> and <b>agentic</b> are{" "}
        <b>gradecore</b> graders, and <b>retrieval grounding</b> is the identical function{" "}
        <b>rag-eval-lab</b> catches hallucinations with. Runs serialize to the same{" "}
        <code>eval_run.json</code> and post to <b>eval-history</b> tagged <code>source=crash_test</code>,
        so this can never scribble on the drift board. Real-model runs
        <b> never send your key here</b> — the browser calls the provider and posts
        <b> only the answers</b> to grade.</p>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
