[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crashkit"
version = "0.1.0"
description = "The AI crash-test platform backend — run a battery, grade via gradecore, store eval-history-shaped runs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
# gradecore and modeldrift are installed editable from sibling repos for the
# Phase 0 local slice (pip install -e ../gradecore -e ../md-src). fastapi/uvicorn
# power the run store + playground API (Phase 0.5).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # The shared grading engine, from PyPI — a git@main dependency is a moving
    # ref, and the replay CI proved it: pip cannot reconcile a direct-URL
    # requirement with the pinned local clone the replay installs.
    "gradecore>=0.10.0",
]
# model-drift (the reused frozen suite + mock provider) is deliberately NOT a
# declared dependency: the VAC replay installs it from a clone pinned to the
# exact commit in protocol.hashes, and declaring any floating ref here would
# put a moving target inside pinned evidence. For local work:
#   pip install ./path-to/model-drift

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["crashkit"]
