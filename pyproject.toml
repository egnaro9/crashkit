[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crashkit"
version = "0.1.0"
description = "The AI crash-test platform backend — run a battery, grade via gradecore, store eval-history-shaped runs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
# gradecore comes from PyPI. fastapi/uvicorn power the run store + playground
# API (Phase 0.5). model-drift is vendored, see the note below.
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # The shared grading engine, from PyPI. A git@main dependency is a moving
    # ref, and the replay CI proved it: pip cannot reconcile a direct-URL
    # requirement with the pinned local clone the replay installs.
    #
    # PINNED, not >=. emit_vac.py refuses any version but GRADECORE_PIN, so a
    # floor let pip resolve a newer gradecore and the repo's own documented
    # install (`pip install -e ".[dev]" && pytest -q`) went red on six bundle
    # tests. CI never saw it: both jobs install gradecore==0.10.0 explicitly
    # before this file is consulted, so the pinned path was the only one under
    # test and the reader's path was not.
    "gradecore==0.10.0",
]
# model-drift (the reused frozen suite + mock provider) is not a dependency at
# all any more. It is not published to any index, so the only way to install it
# was from git, which a Worker runtime cannot do and which made the evidence
# bundle depend on a second repository staying reachable. It is now vendored
# verbatim under crashkit/_vendor/modeldrift, pinned by per-file sha256 in
# crashkit/_vendor/MODELDRIFT_FIDELITY.json and checked by
# tests/test_vendor_fidelity.py. Nothing needs installing for local work.

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
# The vendored tree must be listed explicitly. An unlisted subpackage is
# omitted from a built wheel while every `pip install -e .` path in this
# repo keeps working, so the break would only surface at deploy time.
packages = ["crashkit", "crashkit._vendor", "crashkit._vendor.modeldrift"]

[tool.setuptools.package-data]
"crashkit._vendor" = ["MODELDRIFT_FIDELITY.json"]
