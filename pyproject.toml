[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crashkit"
version = "0.1.0"
description = "The AI crash-test platform backend — run a battery, grade via gradecore, store eval-history-shaped runs"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Erik Hill", email = "erik.hill0987@gmail.com" }]
# gradecore and modeldrift are installed editable from sibling repos for the
# Phase 0 local slice (pip install -e ../gradecore -e ../md-src). fastapi/uvicorn
# power the run store + playground API (Phase 0.5).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    # The shared grading engine and the reused suite. Pinned to git rather than a sibling
    # path so a clean clone of this repo alone installs and runs — the previous instruction
    # assumed ../gradecore and ../model-drift, which only existed on my machine.
    "gradecore @ git+https://github.com/egnaro9/gradecore@main",
    "model-drift @ git+https://github.com/egnaro9/model-drift@main",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools]
packages = ["crashkit"]
