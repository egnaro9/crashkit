name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # crashkit is one lens on a shared engine — and the engine is PINNED:
      # gradecore computes every verdict and model-drift owns the frozen
      # SUITE, so a float on either HEAD would let the deterministic claim
      # drift while this workflow stayed green. The pins here are the same
      # ones vac/vac.json replays against.
      - name: Install the shared engine (pinned), the reused suite (pinned), and crashkit
        run: |
          python -m pip install --upgrade pip
          pip install gradecore==0.10.0
          pip install git+https://github.com/egnaro9/model-drift@3df0ccb5d0b8e72075632508c186795df583a37d
          # rag-eval-lab is required so the cross-repo grounding proof RUNS.
          # Without it the test importorskips and the suite reports green for a
          # bridge claim that never executed. A skipped proof is not a proof.
          pip install git+https://github.com/egnaro9/rag-eval-lab
          pip install -e ".[dev]"
      # The whole point is a grade that reproduces, so the suite includes a test
      # asserting a serialized run is byte-identical across runs (no LLM judge,
      # no clock, no latency in the wire form) — and the vac bundle tests hold
      # the committed vac/ artifacts to byte-identity with a fresh emission on
      # BOTH matrix pythons: a same-interpreter determinism test alone is blind
      # to runtime-dependent bytes.
      - name: Tests — incl. the determinism guarantee and the bundle gates
        run: pytest -q

  bundle-freshness:
    # The battery + emitter re-run must reproduce the closed VAC bundle
    # byte-for-byte, stamp included. `git status --porcelain` rather than
    # `git diff` so a NEW untracked artifact also fails — a diff-only gate
    # is blind to files the emitter grew.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the stamp is the last CODE-touching commit; a
                           # shallow clone collapses that to HEAD and fails
                           # the byte-identity check on the stamp line alone
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install gradecore==0.10.0
          pip install git+https://github.com/egnaro9/model-drift@3df0ccb5d0b8e72075632508c186795df583a37d
          pip install -e .
      - name: re-run the battery + emitter and require identical committed bytes
        run: |
          python emit_vac.py
          status=$(git status --porcelain -- vac)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- vac
            echo "FRESHNESS FAILURE: the committed bundle is not what the code re-emits"
            exit 1
          fi
