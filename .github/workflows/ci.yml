name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # Set for the whole job, not per step: the failure this prevents was an install
    # two lines BELOW the pin, so binding one command is exactly what did not work.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/ci/constraints/replay-gradecore.txt
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # crashkit is one lens on a shared engine — and the engine is PINNED:
      # gradecore computes every verdict and is pinned here, the same pin
      # vac/vac.json replays against; a float on its HEAD would let the
      # deterministic claim drift while this workflow stayed green.
      #
      # model-drift used to be installed here from a pinned git URL, and that
      # install was what made "crashkit runs model-drift's frozen SUITE" true.
      # It is now vendored under crashkit/_vendor/modeldrift and that claim is
      # carried by tests/test_vendor_fidelity.py, which hashes the vendored
      # bytes against the commit they came from. Do not re-add an install here:
      # a second copy on the path makes resolution order load-bearing.
      - name: Install the shared engine (pinned) and crashkit
        run: |
          python -m pip install --upgrade pip
          pip install gradecore==0.10.2
          # rag-eval-lab is required so the cross-repo grounding proof RUNS.
          # Without it the test importorskips and the suite reports green for a
          # bridge claim that never executed. A skipped proof is not a proof.
          pip install git+https://github.com/egnaro9/rag-eval-lab
          pip install -e ".[dev]"
      - name: The replay pin must survive every install above
        run: |
          python - <<'PYEOF'
          import pathlib, sys
          import gradecore
          # Read the expected version OUT of the constraints file. An assertion that
          # restates the number can agree with itself while both drift from emit_vac.
          line = next(l.strip() for l in pathlib.Path(
              "ci/constraints/replay-gradecore.txt").read_text().splitlines()
              if l.strip() and not l.lstrip().startswith("#"))
          want, got = line.split("==")[1], gradecore.__version__
          if got != want:
              sys.exit(f"gradecore {got} survived the installs but the replay constraint says "
                       f"{want}. Something above overrode the pin, which is how this went red "
                       f"for ten days without the pin ever changing.")
          print(f"gradecore {got} matches the replay constraint, after every dependency installed")
          PYEOF
      # The whole point is a grade that reproduces, so the suite includes a test
      # asserting a serialized run is byte-identical across runs (no LLM judge,
      # no clock, no latency in the wire form) — and the vac bundle tests hold
      # the committed vac/ artifacts to byte-identity with a fresh emission on
      # BOTH matrix pythons: a same-interpreter determinism test alone is blind
      # to runtime-dependent bytes.
      - name: Tests — incl. the determinism guarantee and the bundle gates
        run: pytest -q

  # The README's own two commands, with NOTHING pinned for us. Every other job
  # installs the pinned gradecore explicitly and sets PIP_CONSTRAINT, so they test
  # the pinned path and never the one a reader takes. That gap shipped: a
  # `gradecore>=0.10.0` floor let pip resolve a newer one, emit_vac.py refuses any
  # version but its pin, and six bundle tests went red on a fresh clone while
  # all four jobs here stayed green. This job exists to go red instead.
  #
  # Deliberately NO env: PIP_CONSTRAINT and NO explicit engine install. If you
  # find yourself adding either to make this pass, the dependency declaration is
  # what needs fixing.
  readme-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # same reason as bundle-freshness below: the stamp is
                           # the last CODE-touching commit, and a depth-1 clone
                           # cannot see past HEAD, so emit_vac stamps the bundle
                           # commit instead and the diff never matches
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Exactly what README.md tells a reader to run
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # test_retrieval is ignored ON PURPOSE and only here: it hard-fails
          # rather than skips when CI=true and rag-eval-lab is absent, and the
          # README does not tell a reader to install rag-eval-lab. The `test`
          # job above installs it and runs that proof for real.
          pytest -q --ignore=tests/test_retrieval.py
      - name: The emitter must run on that same install
        run: |
          python emit_vac.py
          git diff --exit-code -- vac/

  bundle-freshness:
    # Same job-level constraint as `test`. This job did NOT go red in the ten-day
    # outage, because it never installs rag-eval-lab, and that asymmetry is exactly
    # what made the repo read as half-healthy. Pin it here too rather than rely on
    # this job continuing to install less than the other one.
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/ci/constraints/replay-gradecore.txt
    # The battery + emitter re-run must reproduce the closed VAC bundle
    # byte-for-byte, stamp included. `git status --porcelain` rather than
    # `git diff` so a NEW untracked artifact also fails — a diff-only gate
    # is blind to files the emitter grew.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the stamp is the last CODE-touching commit; a
                           # shallow clone collapses that to HEAD and fails
                           # the byte-identity check on the stamp line alone
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          pip install gradecore==0.10.2
          pip install -e .
      - name: The replay pin must survive every install above
        run: |
          python - <<'PYEOF'
          import pathlib, sys
          import gradecore
          # Read the expected version OUT of the constraints file. An assertion that
          # restates the number can agree with itself while both drift from emit_vac.
          line = next(l.strip() for l in pathlib.Path(
              "ci/constraints/replay-gradecore.txt").read_text().splitlines()
              if l.strip() and not l.lstrip().startswith("#"))
          want, got = line.split("==")[1], gradecore.__version__
          if got != want:
              sys.exit(f"gradecore {got} survived the installs but the replay constraint says "
                       f"{want}. Something above overrode the pin, which is how this went red "
                       f"for ten days without the pin ever changing.")
          print(f"gradecore {got} matches the replay constraint, after every dependency installed")
          PYEOF
      - name: re-run the battery + emitter and require identical committed bytes
        run: |
          python emit_vac.py
          status=$(git status --porcelain -- vac)
          if [ -n "$status" ]; then
            echo "$status"
            git diff -- vac
            echo "FRESHNESS FAILURE: the committed bundle is not what the code re-emits"
            exit 1
          fi
